<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1100" viewBox="0 0 1340 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14532d"/>
    </marker>
  </defs>
  <style>
    .life   { stroke: #b3c4ba; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .pbox   { fill: #3fae68; }
    .pname  { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .act    { fill: #d9f0e2; stroke: #1d9a4e; stroke-width: 1.2; }
    .call   { stroke: #14532d; stroke-width: 1.7; marker-end: url(#sa); }
    .ret    { stroke: #14532d; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#sa); }
    .msg    { font-size: 17px; fill: #1f2937; text-anchor: middle; }
    .msgl   { font-size: 16.5px; fill: #1f2937; }
    .note   { font-size: 15.5px; font-style: italic; fill: #6b7280; text-anchor: middle; }
    .frame  { fill: none; stroke: #14532d; stroke-width: 1.6; }
    .cond   { font-size: 16px; font-style: italic; fill: #14532d; }
    .legend { font-size: 15px; fill: #4b5563; }
  </style>

  <rect width="1340" height="1100" fill="#ffffff"/>
  <text x="670" y="32" text-anchor="middle" font-size="26" font-weight="700" fill="#14532d">Produkt suchen &amp; zum Kühlschrank hinzufügen — Sequenzdiagramm (Teil A · SE)</text>

  <!-- Nutzer (Akteur) -->
  <g stroke="#14532d" stroke-width="2" fill="none">
    <circle cx="75" cy="60" r="9" fill="#ffffff"/>
    <line x1="75" y1="69" x2="75" y2="92"/>
    <line x1="60" y1="77" x2="90" y2="77"/>
    <line x1="75" y1="92" x2="63" y2="108"/>
    <line x1="75" y1="92" x2="87" y2="108"/>
  </g>
  <text x="75" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Nutzer</text>

  <!-- Teilnehmer -->
  <rect class="pbox" x="180" y="64" width="210" height="46" rx="7"/>
  <text class="pname" x="285" y="86" font-size="16">Browser</text>
  <text class="pname" x="285" y="104" font-size="14">add_product.html</text>
  <rect class="pbox" x="435" y="64" width="180" height="46" rx="7"/>
  <text class="pname" x="525" y="86">routes.py</text>
  <text class="pname" x="525" y="104" font-size="14.5">«Blueprint /»</text>
  <rect class="pbox" x="685" y="64" width="180" height="46" rx="7"/>
  <text class="pname" x="775" y="93">fridge_service.py</text>
  <rect class="pbox" x="925" y="64" width="210" height="46" rx="7"/>
  <text class="pname" x="1030" y="86" font-size="15.5">product_repo.py ·</text>
  <text class="pname" x="1030" y="104" font-size="15.5">fridge_repo.py (SQL)</text>
  <rect x="1160" y="64" width="175" height="46" rx="7" fill="#ffffff" stroke="#14532d" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="1247" y="86" text-anchor="middle" font-size="15.5" font-weight="700" fill="#14532d">OpenFoodFacts</text>
  <text x="1247" y="104" text-anchor="middle" font-size="14" fill="#4b5563">«system» · api/v2</text>

  <!-- Lebenslinien -->
  <line class="life" x1="75"   y1="134" x2="75"   y2="1030"/>
  <line class="life" x1="285"  y1="110" x2="285"  y2="1030"/>
  <line class="life" x1="525"  y1="110" x2="525"  y2="1030"/>
  <line class="life" x1="775"  y1="110" x2="775"  y2="1030"/>
  <line class="life" x1="1030" y1="110" x2="1030" y2="1030"/>
  <line class="life" x1="1247" y1="110" x2="1247" y2="1030"/>

  <!-- Aktivierungen -->
  <rect class="act" x="279"  y="160" width="12" height="840"/>
  <rect class="act" x="519"  y="210" width="12" height="750"/>
  <rect class="act" x="769"  y="660" width="12" height="252"/>
  <rect class="act" x="1024" y="305" width="12" height="45"/>
  <rect class="act" x="1024" y="705" width="12" height="170"/>
  <rect class="act" x="1241" y="390" width="12" height="45"/>

  <!-- ① Suche -->
  <text class="msg" x="177" y="153">gibt Suchbegriff ein</text>
  <line class="call" x1="75" y1="160" x2="277" y2="160"/>

  <text class="msg" x="405" y="185">POST /fridge/add</text>
  <text class="msg" x="405" y="204">{action: search, query}</text>
  <line class="call" x1="291" y1="210" x2="517" y2="210"/>

  <!-- unified_search (self) -->
  <path class="call" d="M531,240 H577 V262 H533" fill="none"/>
  <text class="msgl" x="588" y="257">unified_search(q) — kombiniert 3 Quellen</text>

  <!-- lokale DB -->
  <text class="msg" x="777" y="298">search_by_name(q)</text>
  <line class="call" x1="531" y1="305" x2="1022" y2="305"/>
  <text class="msg" x="777" y="338">lokale Treffer</text>
  <line class="ret" x1="1024" y1="345" x2="533" y2="345"/>

  <!-- OpenFoodFacts -->
  <text class="msg" x="887" y="383">search_products(q)</text>
  <line class="call" x1="531" y1="390" x2="1239" y2="390"/>
  <text class="msg" x="887" y="423">Produktdaten + Nährwerte /100g</text>
  <line class="ret" x1="1241" y1="430" x2="533" y2="430"/>

  <text class="note" x="790" y="466">zusätzlich: KI-Schätzung estimate_food() als erster Treffer (→ Teil B)</text>

  <!-- Trefferliste -->
  <text class="msg" x="405" y="498">Trefferliste (render_template)</text>
  <line class="ret" x1="519" y1="505" x2="293" y2="505"/>

  <!-- ② Hinzufügen -->
  <text class="msg" x="177" y="543">wählt Treffer „Hinzufügen“</text>
  <line class="call" x1="75" y1="550" x2="277" y2="550"/>

  <text class="msg" x="405" y="593">POST /fridge/add</text>
  <text class="msg" x="405" y="612">{selected_payload}</text>
  <line class="call" x1="291" y1="618" x2="517" y2="618"/>

  <text class="msg" x="650" y="653">create_dashboard_item_from_data(…)</text>
  <line class="call" x1="531" y1="660" x2="767" y2="660"/>

  <text class="msg" x="902" y="698">get_by_barcode(barcode)</text>
  <line class="call" x1="781" y1="705" x2="1022" y2="705"/>
  <text class="msg" x="902" y="733">Produkt / None</text>
  <line class="ret" x1="1024" y1="740" x2="783" y2="740"/>

  <!-- alt-Rahmen -->
  <rect class="frame" x="700" y="763" width="450" height="72" rx="4"/>
  <path d="M700,763 H756 V781 L744,789 H700 Z" fill="#e9f6ee" stroke="#14532d" stroke-width="1.4"/>
  <text x="708" y="781" font-size="16" font-weight="700" fill="#14532d">alt</text>
  <text class="cond" x="768" y="782">[Produkt noch nicht in DB]</text>
  <text class="msg" x="902" y="806">create_product(Nährwerte /100g)</text>
  <line class="call" x1="781" y1="813" x2="1022" y2="813"/>

  <!-- add_item -->
  <text class="msg" x="902" y="863">add_item(product_id, Menge, user_id)</text>
  <line class="call" x1="781" y1="870" x2="1022" y2="870"/>

  <!-- Rückgaben -->
  <text class="msg" x="650" y="903">Eintrag angelegt</text>
  <line class="ret" x1="769" y1="910" x2="533" y2="910"/>
  <text class="msg" x="405" y="948">Redirect → /dashboard</text>
  <line class="ret" x1="519" y1="955" x2="293" y2="955"/>
  <text class="msg" x="177" y="988">Kühlschrank mit berechneten Nährwerten</text>
  <line class="call" x1="279" y1="995" x2="77" y2="995"/>

  <!-- Legende -->
  <g class="legend">
    <line x1="60" y1="1060" x2="115" y2="1060" stroke="#14532d" stroke-width="1.7" marker-end="url(#sa)"/>
    <text x="125" y="1065">synchroner Aufruf</text>
    <line x1="290" y1="1060" x2="345" y2="1060" stroke="#14532d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sa)"/>
    <text x="355" y="1065">Antwort</text>
    <rect x="450" y="1051" width="12" height="18" class="act"/>
    <text x="472" y="1065">Aktivierung</text>
    <rect x="590" y="1051" width="34" height="18" fill="#ffffff" stroke="#14532d" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="634" y="1065">externes System</text>
  </g>
</svg>
