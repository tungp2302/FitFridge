<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1010" viewBox="0 0 1340 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14532d"/>
    </marker>
  </defs>
  <style>
    .life   { stroke: #b3c4ba; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .pbox   { fill: #1d9a4e; }
    .pname  { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .act    { fill: #d9f0e2; stroke: #1d9a4e; stroke-width: 1.2; }
    .call   { stroke: #14532d; stroke-width: 1.7; marker-end: url(#sa); }
    .ret    { stroke: #14532d; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#sa); }
    .msg    { font-size: 17px; fill: #1f2937; text-anchor: middle; }
    .msgl   { font-size: 16.5px; fill: #1f2937; }
    .note   { font-size: 15.5px; font-style: italic; fill: #6b7280; text-anchor: middle; }
    .frame  { fill: none; stroke: #14532d; stroke-width: 1.6; }
    .cond   { font-size: 16px; font-style: italic; fill: #14532d; }
    .legend { font-size: 15px; fill: #4b5563; }
  </style>

  <rect width="1340" height="1010" fill="#ffffff"/>
  <text x="670" y="32" text-anchor="middle" font-size="26" font-weight="700" fill="#14532d">Freestyle-Rezeptgenerierung — Sequenzdiagramm</text>

  <!-- Nutzer (Akteur) -->
  <g stroke="#14532d" stroke-width="2" fill="none">
    <circle cx="75" cy="60" r="9" fill="#ffffff"/>
    <line x1="75" y1="69" x2="75" y2="92"/>
    <line x1="60" y1="77" x2="90" y2="77"/>
    <line x1="75" y1="92" x2="63" y2="108"/>
    <line x1="75" y1="92" x2="87" y2="108"/>
  </g>
  <text x="75" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Nutzer</text>

  <!-- Teilnehmer -->
  <rect class="pbox" x="215" y="64" width="140" height="46" rx="7"/>
  <text class="pname" x="285" y="93">planner.js</text>
  <rect class="pbox" x="430" y="64" width="190" height="46" rx="7"/>
  <text class="pname" x="525" y="93">routes_asaai.py</text>
  <rect class="pbox" x="680" y="64" width="190" height="46" rx="7"/>
  <text class="pname" x="775" y="93">freestyle_recipe.py</text>
  <rect class="pbox" x="920" y="64" width="220" height="46" rx="7"/>
  <text class="pname" x="1030" y="86" font-size="15.5">freestyle_recipe_</text>
  <text class="pname" x="1030" y="104" font-size="15.5">support.py</text>
  <rect x="1170" y="64" width="160" height="46" rx="7" fill="#ffffff" stroke="#14532d" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="1250" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Ollama «system»</text>
  <text x="1250" y="104" text-anchor="middle" font-size="14" fill="#4b5563">lokales LLM</text>

  <!-- Lebenslinien -->
  <line class="life" x1="75"   y1="134" x2="75"   y2="920"/>
  <line class="life" x1="285"  y1="110" x2="285"  y2="920"/>
  <line class="life" x1="525"  y1="110" x2="525"  y2="920"/>
  <line class="life" x1="775"  y1="110" x2="775"  y2="920"/>
  <line class="life" x1="1030" y1="110" x2="1030" y2="920"/>
  <line class="life" x1="1250" y1="110" x2="1250" y2="920"/>

  <!-- Aktivierungen -->
  <rect class="act" x="279"  y="160" width="12" height="710"/>
  <rect class="act" x="519"  y="210" width="12" height="618"/>
  <rect class="act" x="769"  y="310" width="12" height="473"/>
  <rect class="act" x="1024" y="555" width="12" height="108"/>
  <rect class="act" x="1244" y="455" width="12" height="51"/>

  <!-- ① Klick -->
  <text class="msg" x="177" y="153">klickt „Freestyle-Rezept“</text>
  <line class="call" x1="75" y1="160" x2="277" y2="160"/>

  <!-- ② POST -->
  <text class="msg" x="405" y="185">POST /asaai/recipes/freestyle</text>
  <text class="msg" x="405" y="204">{Makroziele, Rezeptkategorie}</text>
  <line class="call" x1="291" y1="210" x2="517" y2="210"/>

  <!-- ③ DB laden (self) -->
  <path class="call" d="M531,245 H577 V268 H533" fill="none"/>
  <text class="msgl" x="588" y="262">Kühlschrank aus DB laden (user-gescoped)</text>

  <!-- ④ Orchestrierung -->
  <text class="msg" x="650" y="303">generate_freestyle_recipes(…)</text>
  <line class="call" x1="531" y1="310" x2="767" y2="310"/>

  <!-- loop-Rahmen -->
  <rect class="frame" x="660" y="345" width="670" height="380" rx="4"/>
  <path d="M660,345 H724 V363 L712,371 H660 Z" fill="#e9f6ee" stroke="#14532d" stroke-width="1.4"/>
  <text x="670" y="363" font-size="16" font-weight="700" fill="#14532d">loop</text>
  <text class="cond" x="736" y="364">[bis genug valide Rezepte oder max. Versuche]</text>

  <!-- build_prompt (self) -->
  <path class="call" d="M781,392 H827 V415 H783" fill="none"/>
  <text class="msgl" x="838" y="409">build_prompt() — Kühlschrankdaten als Kontext (RAG)</text>

  <!-- LLM-Aufruf -->
  <text class="msg" x="1012" y="448">generate_from_ollama(prompt, JSON-Modus)</text>
  <line class="call" x1="781" y1="455" x2="1242" y2="455"/>
  <text class="msg" x="1012" y="491">JSON-Rezeptvorschläge</text>
  <line class="ret" x1="1244" y1="498" x2="783" y2="498"/>

  <!-- Validierung -->
  <text class="msg" x="902" y="548">valid_recipes() — 7 Checks</text>
  <line class="call" x1="781" y1="555" x2="1022" y2="555"/>

  <!-- MAPE-K (self, nach links) -->
  <path class="call" d="M1024,588 H978 V611 H1022" fill="none"/>
  <text class="msgl" x="968" y="605" text-anchor="end">MAPE-K: _repair_macros()</text>

  <!-- Rückgabe Validierung -->
  <text class="msg" x="902" y="648">valide Rezepte / Fehlergrund</text>
  <line class="ret" x1="1024" y1="655" x2="783" y2="655"/>

  <text class="note" x="995" y="700">invalide → Feedback + bisherige Titel in den nächsten Prompt</text>

  <!-- Rückgaben -->
  <text class="msg" x="650" y="768">Rezepte — Makros im Backend berechnet</text>
  <line class="ret" x1="769" y1="775" x2="533" y2="775"/>
  <text class="msg" x="405" y="813">HTTP 200 {recipes: […]}</text>
  <line class="ret" x1="519" y1="820" x2="293" y2="820"/>
  <text class="msg" x="177" y="855">zeigt Rezeptvorschlag an</text>
  <line class="call" x1="279" y1="862" x2="77" y2="862"/>

  <!-- Legende -->
  <g class="legend">
    <line x1="60" y1="960" x2="115" y2="960" stroke="#14532d" stroke-width="1.7" marker-end="url(#sa)"/>
    <text x="125" y="965">synchroner Aufruf</text>
    <line x1="290" y1="960" x2="345" y2="960" stroke="#14532d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sa)"/>
    <text x="355" y="965">Antwort</text>
    <rect x="450" y="951" width="12" height="18" class="act"/>
    <text x="472" y="965">Aktivierung</text>
    <rect x="590" y="951" width="34" height="18" fill="#ffffff" stroke="#14532d" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="634" y="965">externes System</text>
  </g>
</svg>
