<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1050" viewBox="0 0 1300 1050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14532d"/>
    </marker>
  </defs>
  <style>
    .band-label { font-size: 18px; font-weight: 700; fill: #1a7a44; letter-spacing: 1.5px; }
    .col-label  { font-size: 18px; font-weight: 600; fill: #6b7280; }
    .cls        { fill: #ffffff; stroke: #9fd4b3; stroke-width: 1.2; }
    .hdr-se     { fill: #3fae68; }
    .hdr-ai     { fill: #14532d; }
    .cname      { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .cname-s    { font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .stereo     { font-style: italic; font-weight: 400; }
    .meth       { font-size: 16.5px; fill: #1f2937; text-anchor: middle; }
    .dep        { stroke: #14532d; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; marker-end: url(#arr); }
    .ext        { fill: #ffffff; stroke: #14532d; stroke-width: 1.4; stroke-dasharray: 7 4; }
    .extname    { font-size: 16.5px; font-weight: 700; fill: #14532d; text-anchor: middle; }
    .extsub     { font-size: 14px; fill: #4b5563; text-anchor: middle; }
    .legend     { font-size: 15px; fill: #4b5563; }
  </style>

  <rect width="1300" height="1050" fill="#ffffff"/>
  <text x="650" y="36" text-anchor="middle" font-size="27" font-weight="700" fill="#14532d">FitFridge — Schichtenmodell (UML-Klassendiagramm)</text>
  <text x="375" y="64" text-anchor="middle" class="col-label">Teil A · Software Engineering</text>
  <text x="990" y="64" text-anchor="middle" class="col-label">Teil B · ASaAI</text>

  <!-- Schicht-Bänder -->
  <rect x="30" y="74"  width="1240" height="150" rx="10" fill="#f2faf5" stroke="#d3ead9"/>
  <rect x="30" y="234" width="1240" height="140" rx="10" fill="#e8f5ee" stroke="#cfe8d8"/>
  <rect x="30" y="384" width="1240" height="220" rx="10" fill="#f2faf5" stroke="#d3ead9"/>
  <rect x="30" y="614" width="1240" height="140" rx="10" fill="#e8f5ee" stroke="#cfe8d8"/>
  <rect x="30" y="764" width="1240" height="140" rx="10" fill="#f2faf5" stroke="#d3ead9"/>
  <text x="48" y="99"  class="band-label">1 · PRÄSENTATION — BROWSER</text>
  <text x="48" y="259" class="band-label">2 · ROUTEN — HTTP</text>
  <text x="48" y="409" class="band-label">3 · SERVICES — FACHLOGIK</text>
  <text x="48" y="639" class="band-label">4 · REPOSITORIES — SQL</text>
  <text x="48" y="789" class="band-label">5 · INFRASTRUKTUR</text>

  <!-- Spaltentrenner -->
  <line x1="700" y1="80" x2="700" y2="898" stroke="#c9dccf" stroke-width="1.2" stroke-dasharray="3 5"/>

  <!-- ===== Schicht 1 ===== -->
  <g>
    <rect class="cls" x="60" y="108" width="280" height="84" rx="6"/>
    <rect class="hdr-se" x="60" y="108" width="280" height="32" rx="6"/><rect class="hdr-se" x="60" y="130" width="280" height="10"/>
    <text class="cname" x="200" y="130">Jinja2-Templates <tspan class="stereo">«view»</tspan></text>
    <text class="meth" x="200" y="160">dashboard · tracker · planner</text>
    <text class="meth" x="200" y="182">HTML-Formulare</text>

    <rect class="cls" x="365" y="108" width="245" height="84" rx="6"/>
    <rect class="hdr-se" x="365" y="108" width="245" height="32" rx="6"/><rect class="hdr-se" x="365" y="130" width="245" height="10"/>
    <text class="cname" x="487" y="130">barcode_scan.js</text>
    <text class="meth" x="487" y="160">startBarcodeScan()</text>
    <text class="meth" x="487" y="182">BarcodeDetector / zxing</text>

    <rect class="cls" x="760" y="108" width="300" height="84" rx="6"/>
    <rect class="hdr-ai" x="760" y="108" width="300" height="32" rx="6"/><rect class="hdr-ai" x="760" y="130" width="300" height="10"/>
    <text class="cname" x="910" y="130">planner.js</text>
    <text class="meth" x="910" y="160">loadFreestyleRecipe()</text>
    <text class="meth" x="910" y="182">fetch / JSON</text>
  </g>

  <!-- ===== Schicht 2 ===== -->
  <g>
    <rect class="cls" x="60" y="268" width="340" height="84" rx="6"/>
    <rect class="hdr-se" x="60" y="268" width="340" height="32" rx="6"/><rect class="hdr-se" x="60" y="290" width="340" height="10"/>
    <text class="cname" x="230" y="290">routes.py <tspan class="stereo">«Blueprint /»</tspan></text>
    <text class="meth" x="230" y="320">dashboard() · meal_tracker()</text>
    <text class="meth" x="230" y="342">unified_search(q)</text>

    <rect class="cls" x="760" y="268" width="360" height="84" rx="6"/>
    <rect class="hdr-ai" x="760" y="268" width="360" height="32" rx="6"/><rect class="hdr-ai" x="760" y="290" width="360" height="10"/>
    <text class="cname" x="940" y="290">routes_asaai.py <tspan class="stereo">«Blueprint /asaai»</tspan></text>
    <text class="meth" x="940" y="320">freestyle()</text>
    <text class="meth" x="940" y="342">saved_list() · saved_save()</text>
  </g>

