  <!-- Legende -->
  <g class="legend">
    <line x1="48" y1="948" x2="98" y2="948" stroke="#14532d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="108" y="953">«uses» — A hängt von B ab (Pfeile zeigen nur nach unten)</text>
    <rect x="48" y="968" width="34" height="18" class="ext"/>
    <text x="92" y="982">externes System</text>
    <rect x="240" y="968" width="18" height="18" fill="#3fae68"/>
    <text x="266" y="982">Teil A (SE)</text>
    <rect x="360" y="968" width="18" height="18" fill="#14532d"/>
