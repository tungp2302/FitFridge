    <text class="meth" x="354" y="700">list_items(user_id)</text>
    <text class="meth" x="354" y="722">update_amount()</text>

    <rect class="cls" x="464" y="648" width="205" height="84" rx="6"/>
    <rect class="hdr-se" x="464" y="648" width="205" height="32" rx="6"/><rect class="hdr-se" x="464" y="670" width="205" height="10"/>
