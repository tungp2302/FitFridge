    <text class="meth" x="1132" y="470">valid_recipes() · 7 Checks</text>
    <text class="meth" x="1132" y="492">_repair_macros() · MAPE-K</text>

    <rect class="cls" x="1005" y="512" width="255" height="62" rx="6"/>
    <rect class="hdr-ai" x="1005" y="512" width="255" height="32" rx="6"/><rect class="hdr-ai" x="1005" y="534" width="255" height="10"/>
