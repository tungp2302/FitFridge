  <g>
    <rect class="cls" x="60" y="418" width="290" height="84" rx="6"/>
    <rect class="hdr-se" x="60" y="418" width="290" height="32" rx="6"/><rect class="hdr-se" x="60" y="440" width="290" height="10"/>
