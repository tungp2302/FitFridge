    <text class="cname" x="389" y="820">db.py</text>
    <text class="meth" x="389" y="850">get_db() · sqlite3</text>
    <text class="meth" x="389" y="872">init_db() → schema.sql</text>

    <rect class="cls" x="504" y="798" width="215" height="84" rx="6"/>
    <rect class="hdr-se" x="504" y="798" width="215" height="32" rx="6"/><rect class="hdr-se" x="504" y="820" width="215" height="10"/>
    <text class="cname-s" x="611" y="820">openfoodfacts_client.py</text>
    <text class="meth" x="611" y="850">search_products()</text>
    <text class="meth" x="611" y="872">urllib + certifi</text>

    <rect class="cls" x="760" y="798" width="260" height="84" rx="6"/>
    <rect class="hdr-ai" x="760" y="798" width="260" height="32" rx="6"/><rect class="hdr-ai" x="760" y="820" width="260" height="10"/>
    <text class="cname" x="890" y="820">ollama_client.py</text>
    <text class="meth" x="890" y="850">generate_from_ollama()</text>
    <text class="meth" x="890" y="872">resolve_ollama_model()</text>
  </g>

  <!-- ===== Externe Systeme ===== -->
  <g>
    <rect class="ext" x="504" y="930" width="215" height="56" rx="6"/>
    <text class="extname" x="611" y="953">OpenFoodFacts API <tspan class="stereo">«system»</tspan></text>
    <text class="extsub" x="611" y="974">api/v2 · Produktdaten</text>

    <rect class="ext" x="760" y="930" width="260" height="56" rx="6"/>
    <text class="extname" x="890" y="953">Ollama <tspan class="stereo">«system»</tspan></text>
    <text class="extsub" x="890" y="974">127.0.0.1:11434 · /api/generate</text>
  </g>

