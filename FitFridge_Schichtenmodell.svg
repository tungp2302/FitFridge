    <text class="meth" x="566" y="700">get_day_totals()</text>
    <text class="meth" x="566" y="722">save_settings()</text>

    <rect class="cls" x="1020" y="648" width="240" height="84" rx="6"/>
    <rect class="hdr-ai" x="1020" y="648" width="240" height="32" rx="6"/><rect class="hdr-ai" x="1020" y="670" width="240" height="10"/>
    <text class="cname-s" x="1140" y="670">app_settings_repo.py</text>
    <text class="meth" x="1140" y="700">get_settings()</text>
    <text class="meth" x="1140" y="722">LLM-Modellwahl je Nutzer</text>
  </g>

  <!-- ===== Schicht 5 ===== -->
  <g>
    <rect class="cls" x="60" y="798" width="215" height="84" rx="6"/>
    <rect class="hdr-se" x="60" y="798" width="215" height="32" rx="6"/><rect class="hdr-se" x="60" y="820" width="215" height="10"/>
